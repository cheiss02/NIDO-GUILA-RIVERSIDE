               src="assets/pictures/dsc08009.jpg"
               srcset="assets/pictures/dsc08009-1024.jpg 1024w, assets/pictures/dsc08009.jpg 1920w"
               sizes="100vw" width="1920" height="1280" loading="lazy">
          <img class="hero-slide" alt="A player striking the ball on a bright training day"
               src="assets/pictures/dsc_0457.jpg"

               sizes="100vw" width="1920" height="1280" loading="lazy">

               src="assets/pictures/hjn06328.jpg"
               srcset="assets/pictures/hjn06328-1024.jpg 1024w, assets/pictures/hjn06328.jpg 1920w"
               sizes="100vw" width="1920" height="1280" loading="lazy">
