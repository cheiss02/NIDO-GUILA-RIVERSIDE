name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - "assets/pictures/gallery/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild album manifest and thumbnails
        run: node scripts/build-gallery.mjs

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pictures/gallery-albums.json assets/pictures/gallery-thumbs
          if git diff --cached --quiet; then
            echo "Gallery already up to date."
          else
            git commit -m "Rebuild gallery albums [skip ci]"
            git push
          fi
